name: Build and Push to ECR
on:
  push:
    branches: ['main','dev']
    
permissions:
  id-token: write
  contents: read

jobs:
  build-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Build Docker image
        run: docker build -t ${{ secrets.ECR_REPO }}/petclinic-dev-repo:latest .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.ECR_REPO }}/petclinic-dev-repo:latest
          format: table
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push image to ECR
        run: |
          docker push ${{ secrets.ECR_REPO }}/petclinic-dev-repo:latest
  
  Deploy_to_ecs:
    runs-on: ubuntu-latest
    needs: build-scan
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE }}

      - name: Download current task definition
        run: |
          set -euo pipefail
          aws ecs describe-task-definition \
            --task-definition Depportfolio \
            --query taskDefinition \
            > task-definition.json
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            task-definition.json > task-definition-clean.json

      - name: Render Amazon ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition-clean.json
          container-name: exercise
          image: ${{ secrets.ECR_REPO }}/petclinic-dev-repo:latest

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          service: Depportfolio-service
          cluster: depcluster
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          wait-for-service-stability: true
     
              